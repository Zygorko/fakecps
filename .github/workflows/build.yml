name: Build Forge 1.8.9 Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Zainstaluj Jave 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Zainstaluj Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Skompiluj mod do pliku .jar
        run: gradle build

      - name: Udostepnij gotowy plik .jar do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: FakeCpsMod-1.8.9-JAR
          path: build/libs/*.jar
